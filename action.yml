name: 'Setup LXD'
description: 'Install and configure LXD on the runner'
inputs:
  channel:
    default: 'latest/candidate'
    description: 'Snap channel to install LXD from'
    required: false
    type: string
  group:
    default: 'adm'
    description: 'Name of the group that will have access to LXD'
    required: false
    type: string
  preseed:
    default: ''
    description: 'Preseed to use when initialising LXD'
    required: false
    type: string
  bridges:
    default: 'lxdbr0'
    description: 'Comma-separated list of LXD bridges to allow through the firewall'
    required: false
    type: string
  attempts:
    default: '5'
    description: 'How many times to try installing or refreshing the LXD snap'
    required: false
    type: string
  retry-delay:
    default: '15'
    description: 'Seconds to wait before the first retry; it doubles after each one, up to 60 or this value, whichever is larger'
    required: false
    type: string

runs:
  using: "composite"
  steps:

    - name: Install/refresh LXD snap
      shell: bash
      env:
        INPUT_CHANNEL: ${{ inputs.channel }}
        INPUT_ATTEMPTS: ${{ inputs.attempts }}
        INPUT_RETRY_DELAY: ${{ inputs.retry-delay }}
      # The Snap Store times out or drops connections often enough to fail CI, so retry with backoff.
      run: |
        set -x
        if snap list lxd; then
          action=refresh
        else
          action=install
        fi
        delay="${INPUT_RETRY_DELAY}"
        max_delay=$(( delay > 60 ? delay : 60 ))
        for attempt in $(seq 1 "${INPUT_ATTEMPTS}"); do
          if sudo snap "${action}" lxd --channel="${INPUT_CHANNEL}"; then
            exit 0
          fi
          if [ "${attempt}" -lt "${INPUT_ATTEMPTS}" ]; then
            echo "snap ${action} lxd failed (attempt ${attempt} of ${INPUT_ATTEMPTS}), retrying in ${delay}s"
            sleep "${delay}"
            delay=$(( delay * 2 > max_delay ? max_delay : delay * 2 ))
          fi
        done
        echo "::error::snap ${action} lxd failed after ${INPUT_ATTEMPTS} attempts"
        exit 1

    - name: Set up permissions for socket
      shell: bash
      run: |
        while [ -n "$(snap changes lxd 2>/dev/null | awk '/^[0-9]+/ {if ($2 != "Done") print $2 }')" ]; do
          echo "Waiting for snap changes on LXD to finish"
          sleep 1
        done
        sudo snap set lxd daemon.group=${{ inputs.group }}

    - name: Initialise LXD
      shell: bash
      env:
        # Use an environment variable to have correct quoting and escaping
        INPUT_PRESEED: ${{ inputs.preseed }}
      run: |
        sudo lxd waitready
        if [[ "${INPUT_PRESEED}" == "" ]]; then
          sudo lxd init --auto
          sudo lxc config set images.compression_algorithm none
        else
          sudo lxd init --preseed <<< "${INPUT_PRESEED}"
        fi

    - name: Configure firewall
      shell: bash
      run: |
        set -x
        IFS=',' read -ra bridges <<< "${{ inputs.bridges }}"
        for i in "${bridges[@]}"; do
          bridge=$(echo "$i" | xargs)  # Trim whitespace
          if sudo iptables -nL DOCKER-USER; then
            sudo iptables  -I DOCKER-USER -i "$bridge" -j ACCEPT
            sudo iptables  -I DOCKER-USER -o "$bridge" -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          fi
          if sudo ip6tables -nL DOCKER-USER; then
            sudo ip6tables -I DOCKER-USER -i "$bridge" -j ACCEPT
            sudo ip6tables -I DOCKER-USER -o "$bridge" -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          fi
        done
